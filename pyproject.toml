[project]
name = "gamerquest-social-agent"
version = "0.6.0"
description = "Standalone GamerQuestFR Instagram growth agent"
requires-python = ">=3.11"
dependencies = [
  "edge-tts>=7.2,<8",
  "google-auth>=2.35,<3",
]

[tool.setuptools]
packages = ["agent", "app", "automation", "content", "media", "quality", "social", "storage"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
