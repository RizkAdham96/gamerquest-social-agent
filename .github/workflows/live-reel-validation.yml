name: GamerQuest Live Reel Validation

on:
  push:
    paths:
      - ".github/workflows/live-reel-validation.yml"

permissions:
  contents: write

concurrency:
  group: gamerquest-social-agent
  cancel-in-progress: false

jobs:
  live-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GQ_LIVE_PUBLISH: "true"
      GQ_MAX_REELS_PER_WEEK: ${{ vars.GQ_MAX_REELS_PER_WEEK || '3' }}
      GQ_BYPASS_WEEKLY_LIMIT: "true"
      GQ_MIN_TOPIC_SCORE: ${{ vars.GQ_MIN_TOPIC_SCORE || '55' }}
      GQ_META_API_VERSION: ${{ vars.GQ_META_API_VERSION || 'v26.0' }}
      GQ_INSTAGRAM_USER_ID: ${{ secrets.GQ_INSTAGRAM_USER_ID }}
      GQ_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.GQ_INSTAGRAM_ACCESS_TOKEN }}
      GQ_YOUTUBE_API_KEY: ${{ secrets.GQ_YOUTUBE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Verify test suite
        run: pytest -q

      - name: Validate live publishing configuration
        run: |
          test -n "$GQ_INSTAGRAM_USER_ID" || (echo "Missing GQ_INSTAGRAM_USER_ID secret" >&2; exit 1)
          test -n "$GQ_INSTAGRAM_ACCESS_TOKEN" || (echo "Missing GQ_INSTAGRAM_ACCESS_TOKEN secret" >&2; exit 1)

      - name: Load candidate topics
        env:
          TOPICS_URL: ${{ vars.GQ_TOPICS_URL }}
        run: |
          DEFAULT_TOPICS_URL="https://raw.githubusercontent.com/RizkAdham96/gamerquest-automation/main/gamerquest-deals-feed.json"
          if [ -n "$TOPICS_URL" ]; then
            curl --fail --location --retry 3 "$TOPICS_URL" -o "$RUNNER_TEMP/topics.json"
          else
            curl --fail --location --retry 3 "$DEFAULT_TOPICS_URL" -o "$RUNNER_TEMP/topics.json"
          fi

      - name: Publish Reel
        id: run_agent
        shell: bash
        run: |
          mkdir -p output
          python -m automation.main \
            --topics "$RUNNER_TEMP/topics.json" \
            --output-dir output \
            --publish-log state/publish_log.json \
            2>&1 | tee output/social-agent.log

      - name: Persist publish state safely
        if: success()
        shell: bash
        run: |
          if git diff --quiet -- state/publish_log.json; then
            echo "No publish-state change."
            exit 0
          fi

          cp state/publish_log.json "$RUNNER_TEMP/publish_log.json"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p state
          cp "$RUNNER_TEMP/publish_log.json" state/publish_log.json

          git config user.name "gamerquest-social-agent[bot]"
          git config user.email "gamerquest-social-agent[bot]@users.noreply.github.com"
          git add state/publish_log.json

          if git diff --cached --quiet; then
            echo "Publish state already current."
            exit 0
          fi

          git commit -m "chore: persist Instagram publish state"
          git push origin HEAD:main

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamerquest-live-reel-validation
          path: output/
          if-no-files-found: ignore
          retention-days: 30
