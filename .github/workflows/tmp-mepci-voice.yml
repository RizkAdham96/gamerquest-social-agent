name: tmp-mepci-voice
on:
  push:
    branches: [tmp-mepci-voice]
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      GQ_FISH_VOICE_ID: ${{ vars.GQ_FISH_VOICE_ID || secrets.GQ_FISH_VOICE_ID }}
      GQ_FISH_MODEL: ${{ vars.GQ_FISH_MODEL || 's2.1-pro-free' }}
      GQ_FISH_SPEED: ${{ vars.GQ_FISH_SPEED || '1.0' }}
      GQ_FISH_TEMPO: ${{ vars.GQ_FISH_TEMPO || '0.88' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Generate MEP-CI lines with the GamerQuest Fish Audio voice
        run: |
          rm -rf mepci_voice && mkdir mepci_voice
          python - <<'PY'
          import os, time
          from pathlib import Path
          from content.voice import _fish_request, change_tempo
          key=os.environ["FISH_AUDIO_API_KEY"]; vid=os.environ.get("GQ_FISH_VOICE_ID","")
          model=os.environ["GQ_FISH_MODEL"]; speed=float(os.environ["GQ_FISH_SPEED"]); tempo=float(os.environ["GQ_FISH_TEMPO"])
          print("key set:", bool(key), "voice id set:", bool(vid), "model:", model, "tempo:", tempo)
          lines=["Au sixième étage, vous ouvrez le robinet. Comment l'eau est montée ?",
             "Le réseau de la ville n'a pas assez de pression pour monter si haut.",
             "Alors on la stocke au sous-sol, dans une bâche. Et un surpresseur la pousse vers le haut.",
             "Dans la colonne montante, chaque étage reçoit la même pression.",
             "Tout est calculé, posé, et testé.",
             "La solution ? Mèp-si. Plomberie, électricité, ventilation.",
             "Mèp-si. Vos lots techniques, maîtrisés.",
             "Merci de votre attention."]
          tag="[voix off professionnelle de documentaire, chaleureuse, posée, fluide, articulée] "
          for name,sp in [("P1",0.9),("P2",0.9)]:
              t=tag+"\n".join(lines)
              audio=b""
              for a in range(4):
                  try:
                      audio=_fish_request(t,key,vid,model,sp)
                      if len(audio)>5000: break
                  except Exception as e:
                      print("retry",name,e); time.sleep(15*(a+1))
              Path(f"mepci_voice/take_{name}.mp3").write_bytes(audio); print("ok",name,len(audio))
          PY
      - name: Commit audio back to this temporary branch
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          git add -A mepci_voice && git commit -m "MEP-CI voice lines (Fish) [skip ci]" && git push
