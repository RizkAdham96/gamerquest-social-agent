name: GamerQuest Social Agent

on:
  workflow_dispatch:
    inputs:
      publish_to_instagram:
        description: "Publish this Reel to Instagram"
        required: true
        default: false
        type: boolean
      extra_reel_today:
        description: "Publish even if a Reel was already posted today"
        required: false
        default: false
        type: boolean

  schedule:
    # Two hidden-gem Reels a day (they replaced the carousels). Four slots
    # for two Reels: a missed, late or failed run is made up by the next one.
    # The run itself refuses a third Reel and keeps three hours between two.
    - cron: "17 9 * * *"
    - cron: "17 12 * * *"
    - cron: "17 15 * * *"
    - cron: "47 18 * * *"

permissions:
  contents: write

concurrency:
  group: gamerquest-social-agent
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GQ_LIVE_PUBLISH: ${{ github.event_name == 'schedule' && 'true' || (inputs.publish_to_instagram && 'true' || 'false') }}
      GQ_MAX_REELS_PER_WEEK: ${{ vars.GQ_MAX_REELS_PER_WEEK || '14' }}
      GQ_MAX_REELS_PER_DAY: ${{ vars.GQ_MAX_REELS_PER_DAY || '2' }}
      GQ_BYPASS_WEEKLY_LIMIT: "false"
      GQ_ALLOW_EXTRA_REEL: ${{ github.event_name == 'workflow_dispatch' && inputs.extra_reel_today && 'true' || 'false' }}
      GQ_META_API_VERSION: ${{ vars.GQ_META_API_VERSION || 'v26.0' }}
      GQ_INSTAGRAM_USER_ID: ${{ secrets.GQ_INSTAGRAM_USER_ID }}
      GQ_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.GQ_INSTAGRAM_ACCESS_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      # SELF_ONLY until TikTok has audited the app; then PUBLIC_TO_EVERYONE.
      GQ_TIKTOK_PRIVACY: ${{ vars.GQ_TIKTOK_PRIVACY || 'SELF_ONLY' }}
      GQ_REEL_VOICE: ${{ vars.GQ_REEL_VOICE || 'fr-FR-VivienneMultilingualNeural' }}
      # Optional premium voice. Without the key the free voice above is used.
      FISH_AUDIO_API_KEY: ${{ secrets.FISH_AUDIO_API_KEY }}
      # Read from either place: the ID is not sensitive, but it was first saved as a secret.
      GQ_FISH_VOICE_ID: ${{ vars.GQ_FISH_VOICE_ID || secrets.GQ_FISH_VOICE_ID }}
      GQ_FISH_MODEL: ${{ vars.GQ_FISH_MODEL || 's2.1-pro-free' }}
      GQ_FISH_SPEED: ${{ vars.GQ_FISH_SPEED || '1.0' }}
      # Below 1 slows the narration; 1 leaves the voice at its own pace.
      GQ_FISH_TEMPO: ${{ vars.GQ_FISH_TEMPO || '0.88' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        # A run sat in this step for twenty minutes on a stalled package
        # mirror. Each attempt is time-limited and the install is retried.
        run: |
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get -o Acquire::Retries=3 update               && timeout 360 sudo -E apt-get install -y --no-install-recommends                    ffmpeg fonts-dejavu-core fonts-montserrat; then
              exit 0
            fi
            echo "Package install attempt ${attempt} failed or stalled; retrying."
            sleep 15
          done
          echo "System packages could not be installed." >&2
          exit 1

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          # Speech recogniser used to time captions for voices that do not
          # report word timings.
          pip install faster-whisper numpy

      - name: Verify test suite
        run: pytest -q

      - name: Show publishing mode
        run: |
          echo "GQ_LIVE_PUBLISH=$GQ_LIVE_PUBLISH"
          if [ "$GQ_LIVE_PUBLISH" = "true" ]; then
            echo "This run WILL publish a Reel to Instagram."
          else
            echo "This run is DRY-RUN only and will not publish."
          fi

      - name: Validate configuration
        run: |
          test -n "$GROQ_API_KEY" || (echo "Missing GROQ_API_KEY secret" >&2; exit 1)
          if [ "$GQ_LIVE_PUBLISH" = "true" ]; then
            test -n "$GQ_INSTAGRAM_USER_ID" || (echo "Missing GQ_INSTAGRAM_USER_ID secret" >&2; exit 1)
            test -n "$GQ_INSTAGRAM_ACCESS_TOKEN" || (echo "Missing GQ_INSTAGRAM_ACCESS_TOKEN secret" >&2; exit 1)
          fi
          echo "Configuration is present."

      - name: Validate Instagram token before production
        if: ${{ env.GQ_LIVE_PUBLISH == 'true' }}
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 2 \
            -H "Authorization: Bearer $GQ_INSTAGRAM_ACCESS_TOKEN" \
            "https://graph.facebook.com/$GQ_META_API_VERSION/$GQ_INSTAGRAM_USER_ID?fields=id" \
            > /dev/null
          echo "Instagram token preflight passed."

      - name: Produce the daily Reel
        id: run_agent
        shell: bash
        run: |
          mkdir -p output
          set +e
          python -m automation.daily_reel \
            --output-dir output \
            --publish-log state/publish_log.json \
            2>&1 | tee output/social-agent.log
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Persist failure diagnosis
        if: ${{ failure() && steps.run_agent.outcome == 'failure' }}
        shell: bash
        run: |
          {
            echo "Run failed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            tail -n 160 output/social-agent.log
          } > "$RUNNER_TEMP/last_run_error.txt"

          git fetch origin main
          git reset --hard origin/main
          mkdir -p state
          cp "$RUNNER_TEMP/last_run_error.txt" state/last_run_error.txt

          git config user.name "gamerquest-social-agent[bot]"
          git config user.email "gamerquest-social-agent[bot]@users.noreply.github.com"
          git add state/last_run_error.txt
          git commit -m "chore: persist Reel failure diagnosis" || exit 0
          git push origin HEAD:main

      - name: Upload generated Reel for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gamerquest-social-agent-output
          path: |
            output/reel.mp4
            output/script.json
            output/social-agent.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Persist publish state
        if: ${{ success() }}
        run: |
          cp state/publish_log.json "$RUNNER_TEMP/publish_log.json"
          cp state/gem_candidates.json "$RUNNER_TEMP/gem_candidates.json"
          # TikTok may have issued a new refresh token during this run.
          if [ -f state/tiktok_token.enc ]; then
            cp state/tiktok_token.enc "$RUNNER_TEMP/tiktok_token.enc"
          fi
          git fetch origin main
          git reset --hard origin/main
          mkdir -p state
          cp "$RUNNER_TEMP/gem_candidates.json" state/gem_candidates.json
          if [ "$GQ_LIVE_PUBLISH" = "true" ]; then
            cp "$RUNNER_TEMP/publish_log.json" state/publish_log.json
            if [ -f "$RUNNER_TEMP/tiktok_token.enc" ]; then
              cp "$RUNNER_TEMP/tiktok_token.enc" state/tiktok_token.enc
            fi
          fi
          rm -f state/last_run_error.txt

          git config user.name "gamerquest-social-agent[bot]"
          git config user.email "gamerquest-social-agent[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "State is already current on main."
            exit 0
          fi
          git commit -m "chore: persist Reel state"
          git push origin HEAD:main
