name: GamerQuest Social Agent

on:
  workflow_dispatch:
    inputs:
      publish_to_instagram:
        description: "Publish this Reel to Instagram"
        required: true
        default: false
        type: boolean

  # One-shot live trigger used only for the requested immediate Reel publish.
  push:
    paths:
      - "trigger-live-reel-now.txt"

  schedule:
    - cron: "0 17 * * 1,3,5"

permissions:
  contents: write

concurrency:
  group: gamerquest-social-agent
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GQ_LIVE_PUBLISH: ${{ github.event_name == 'push' && 'true' || (github.event_name == 'workflow_dispatch' && (inputs.publish_to_instagram && 'true' || 'false') || (vars.GQ_LIVE_PUBLISH || 'false')) }}
      GQ_MAX_REELS_PER_WEEK: ${{ vars.GQ_MAX_REELS_PER_WEEK || '3' }}
      GQ_MIN_TOPIC_SCORE: ${{ vars.GQ_MIN_TOPIC_SCORE || '55' }}
      GQ_META_API_VERSION: ${{ vars.GQ_META_API_VERSION || 'v26.0' }}
      GQ_INSTAGRAM_USER_ID: ${{ secrets.GQ_INSTAGRAM_USER_ID }}
      GQ_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.GQ_INSTAGRAM_ACCESS_TOKEN }}
      GQ_YOUTUBE_API_KEY: ${{ secrets.GQ_YOUTUBE_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Verify test suite
        run: pytest -q

      - name: Show publishing mode
        run: |
          echo "GQ_LIVE_PUBLISH=$GQ_LIVE_PUBLISH"
          if [ "$GQ_LIVE_PUBLISH" = "true" ]; then
            echo "This run WILL publish a Reel to Instagram."
          else
            echo "This run is DRY-RUN only and will not publish."
          fi

      - name: Validate live publishing configuration
        if: ${{ env.GQ_LIVE_PUBLISH == 'true' }}
        run: |
          test -n "$GQ_INSTAGRAM_USER_ID" || (echo "Missing GQ_INSTAGRAM_USER_ID secret" >&2; exit 1)
          test -n "$GQ_INSTAGRAM_ACCESS_TOKEN" || (echo "Missing GQ_INSTAGRAM_ACCESS_TOKEN secret" >&2; exit 1)
          echo "Instagram live-publish configuration is present."

      - name: Load candidate topics
        env:
          TOPICS_URL: ${{ vars.GQ_TOPICS_URL }}
        run: |
          if [ -n "$TOPICS_URL" ]; then
            curl --fail --location --retry 3 "$TOPICS_URL" -o "$RUNNER_TEMP/topics.json"
            echo "Loaded topics from GQ_TOPICS_URL."
          elif [ -f "topics.live.json" ]; then
            cp topics.live.json "$RUNNER_TEMP/topics.json"
            echo "Loaded topics from repository fallback topics.live.json."
          else
            echo "No live topics source is available." >&2
            exit 1
          fi

      - name: Run social agent
        id: run_agent
        shell: bash
        run: |
          mkdir -p output
          set +e
          python -m automation.main \
            --topics "$RUNNER_TEMP/topics.json" \
            --output-dir output \
            --publish-log state/publish_log.json \
            2>&1 | tee output/social-agent.log
          STATUS=${PIPESTATUS[0]}
          echo "exit_code=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Persist failure diagnosis
        if: ${{ failure() && steps.run_agent.outcome == 'failure' }}
        shell: bash
        run: |
          mkdir -p state
          {
            echo "Run failed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            tail -n 160 output/social-agent.log
          } > state/last_run_error.txt

          git config user.name "gamerquest-social-agent[bot]"
          git config user.email "gamerquest-social-agent[bot]@users.noreply.github.com"
          git add state/last_run_error.txt
          git commit -m "chore: persist Reel failure diagnosis" || exit 0
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload generated Reel for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamerquest-social-agent-output
          path: output/
          if-no-files-found: ignore
          retention-days: 90

      - name: Persist publish state
        if: ${{ success() && env.GQ_LIVE_PUBLISH == 'true' }}
        run: |
          if git diff --quiet -- state/publish_log.json; then
            echo "No publish-state change."
            exit 0
          fi
          git config user.name "gamerquest-social-agent[bot]"
          git config user.email "gamerquest-social-agent[bot]@users.noreply.github.com"
          git add state/publish_log.json
          git commit -m "chore: persist Instagram publish state"
          git push
