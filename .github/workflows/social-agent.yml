name: GamerQuest Social Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * 1,3,5"

permissions:
  contents: write

concurrency:
  group: gamerquest-social-agent
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GQ_LIVE_PUBLISH: ${{ vars.GQ_LIVE_PUBLISH || 'false' }}
      GQ_MAX_REELS_PER_WEEK: ${{ vars.GQ_MAX_REELS_PER_WEEK || '3' }}
      GQ_MIN_TOPIC_SCORE: ${{ vars.GQ_MIN_TOPIC_SCORE || '55' }}
      GQ_META_API_VERSION: ${{ vars.GQ_META_API_VERSION || 'v26.0' }}
      GQ_INSTAGRAM_USER_ID: ${{ secrets.GQ_INSTAGRAM_USER_ID }}
      GQ_INSTAGRAM_ACCESS_TOKEN: ${{ secrets.GQ_INSTAGRAM_ACCESS_TOKEN }}
      GQ_YOUTUBE_API_KEY: ${{ secrets.GQ_YOUTUBE_API_KEY }}
      GQ_DRIVE_PUBLISHED_FOLDER_ID: ${{ vars.GQ_DRIVE_PUBLISHED_FOLDER_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Install agent
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Verify test suite
        run: pytest -q

      - name: Prepare Google Drive credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GQ_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/gq-service-account.json"
            echo "GQ_GOOGLE_SERVICE_ACCOUNT_FILE=$RUNNER_TEMP/gq-service-account.json" >> "$GITHUB_ENV"
          fi

      - name: Load candidate topics
        env:
          TOPICS_URL: ${{ vars.GQ_TOPICS_URL }}
        run: |
          if [ -n "$TOPICS_URL" ]; then
            curl --fail --location --retry 3 "$TOPICS_URL" -o "$RUNNER_TEMP/topics.json"
          elif [ "$GQ_LIVE_PUBLISH" = "true" ]; then
            echo "GQ_TOPICS_URL must be configured before live publishing." >&2
            exit 1
          else
            cp topics.sample.json "$RUNNER_TEMP/topics.json"
          fi

      - name: Run social agent
        run: |
          python -m automation.main \
            --topics "$RUNNER_TEMP/topics.json" \
            --output-dir output \
            --publish-log state/publish_log.json

      - name: Upload generated Reel for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamerquest-social-agent-output
          path: output/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist publish state
        if: ${{ success() && vars.GQ_LIVE_PUBLISH == 'true' }}
        run: |
          if git diff --quiet -- state/publish_log.json; then
            echo "No publish-state change."
            exit 0
          fi
          git config user.name "gamerquest-social-agent[bot]"
          git config user.email "gamerquest-social-agent[bot]@users.noreply.github.com"
          git add state/publish_log.json
          git commit -m "chore: persist Instagram publish state"
          git push
